<section class="hero">
  <!-- Polaroid Izquierda (Flotante) -->
  <div class="hero-polaroid polaroid-left">
    <img src="/images/hero/Hero 1.png" alt="Mascota con su dueña" />
  </div>

  <div class="hero-container container">
    <div class="hero-center-content">
      <div class="hero-header-group">
        <h1 class="hero-title">Cada huellita merece volver a casa</h1>
        <p class="hero-description">
          Somos una comunidad que une corazones para ayudar a mascotas a reencontrarse con sus
          familias o encontrar un hogar donde sean felices.
        </p>
      </div>

      <div class="hero-actions-new">
        <app-button routerLink="/pets/report" variant="primary" size="lg" shape="pill">
          <img src="/icons/HuellaIcon.svg" alt="Huella" />
          Reportar Mascota
        </app-button>
        <app-button routerLink="/pets/map" variant="outline" size="lg" shape="pill">
          Explorar el mapa
        </app-button>
      </div>

      <div class="hero-stats-new">
        <div class="stat-item-new">
          <img src="/icons/MapIcon.svg" alt="Mapa" class="stat-icon" />
          <span>Mapa interactivo</span>
        </div>
        <div class="stat-item-new">
          <img src="/icons/CampanaIcon.svg" alt="Campana" class="stat-icon" />
          <span>Alertas cercanas</span>
        </div>
        <div class="stat-item-new">
          <img src="/icons/ApoyoIcon.svg" alt="Apoyo" class="stat-icon" />
          <span>Apoyo comunitario</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Polaroid Derecha (Flotante) -->
  <div class="hero-polaroid polaroid-right">
    <img src="/images/hero/hero 2.png" alt="Mascotas rescatadas" />
  </div>

  <!-- Curva de transición al final del hero -->
  <div class="hero-wave">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 100" preserveAspectRatio="none">
      <path
        d="M0,50 C180,90 540,10 720,50 C900,90 1260,10 1440,50 L1440,100 L0,100 Z"
        fill="var(--bg-dark)"
      />
    </svg>
  </div>
</section>
