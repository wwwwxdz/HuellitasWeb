<div class="filter-container">
  <!-- Categorías -->
  <div class="categories-group">
    <button
      id="cat-all"
      class="cat-pill"
      [class.active]="selectedEspecieId() === ''"
      (click)="selectEspecie('')"
    >
      <i class="material-icons">grid_view</i>
      <span>Todos</span>
    </button>
    
    <button
      id="cat-gato"
      class="cat-pill"
      [class.active]="idGato() !== null && selectedEspecieId() === idGato()"
      [disabled]="idGato() === null"
      (click)="selectEspecie(idGato() || '')"
    >
      @if (idGato() !== null && getEspecieSvg('gato'); as svg) {
        <span class="species-svg-icon" [innerHTML]="svg" style="margin-right: 6px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; flex-shrink: 0;"></span>
      } @else {
        <i class="material-icons notranslate" style="font-size: 1.15rem; line-height: 1; display: inline-flex; align-items: center; justify-content: center; margin-right: 4px;">pets</i>
      }
      <span>Gato</span>
    </button>

    <button
      id="cat-perro"
      class="cat-pill"
      [class.active]="idPerro() !== null && selectedEspecieId() === idPerro()"
      [disabled]="idPerro() === null"
      (click)="selectEspecie(idPerro() || '')"
    >
      @if (idPerro() !== null && getEspecieSvg('perro'); as svg) {
        <span class="species-svg-icon" [innerHTML]="svg" style="margin-right: 6px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; flex-shrink: 0;"></span>
      } @else {
        <i class="material-icons notranslate" style="font-size: 1.15rem; line-height: 1; display: inline-flex; align-items: center; justify-content: center; margin-right: 4px;">pets</i>
      }
      <span>Perro</span>
    </button>

    <button
      id="cat-otros"
      class="cat-pill"
      [class.active]="selectedEspecieId() === 'otros'"
      (click)="selectEspecie('otros')"
    >
      <i class="material-icons notranslate" style="font-size: 1.15rem; line-height: 1; display: inline-flex; align-items: center; justify-content: center; margin-right: 4px;">pets</i>
      <span>Otros</span>
    </button>
  </div>

  <!-- Controles Derecha (Ordenación y Filtros Rápidos) -->
  <div class="controls-group">
    <!-- Ordenación -->
    <div class="sort-group">
      <span class="sort-label">Ordenar:</span>
      <app-select
        id="sort-select"
        [(value)]="selectedOrder"
        [options]="sortOptions"
      ></app-select>
    </div>

    <!-- Filtros Rápidos -->
    <div class="fast-filters-group">
      <button
        id="btn-filter-nearby"
        class="toggle-pill"
        [class.active]="geoActive()"
        (click)="openMap.emit()"
      >
        <i class="material-icons">place</i>
        <span>Filtrar Zona</span>
        @if (geoActive()) {
          <span class="badge animate-scale-in">
            {{ radio() > 0 ? radio() + ' km' : 'Activo' }}
            <span class="clear-geo-btn" (click)="$event.stopPropagation(); clearGeo.emit()">
              <i class="material-icons">close</i>
            </span>
          </span>
        }
      </button>

      @if (showRewardOption()) {
        <button
          id="btn-filter-reward"
          class="toggle-pill"
          [class.active]="withReward()"
          (click)="toggleReward()"
        >
          <i class="material-icons">paid</i>
          <span>Con recompensa</span>
          @if (withReward()) {
            <span class="badge animate-scale-in">
              Activo
              <span class="clear-geo-btn" (click)="$event.stopPropagation(); withReward.set(false)">
                <i class="material-icons">close</i>
              </span>
            </span>
          }
        </button>
      }
    </div>
  </div>
</div>
