@if (isOpen()) {
  <div
    (click)="handleCancel()"
    style="
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      font-family: var(--font-main), sans-serif;
    "
  >
    <div
      (click)="$event.stopPropagation()"
      style="
        width: 90%;
        max-width: 1050px;
        height: 80vh;
        max-height: 650px;
        background-color: #121214;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
      "
    >
      <!-- Header -->
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 20px 28px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        "
      >
        <h2 style="font-size: 1.25rem; font-weight: 700; color: #f3f4f6; margin: 0;">
          Filtrar por Ubicación y Rango
        </h2>
        <button
          (click)="handleCancel()"
          style="
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.03);
          "
        >
          <i class="material-icons" style="font-size: 20px;">close</i>
        </button>
      </div>

      <!-- Content Body -->
      <div style="display: flex; flex: 1; overflow: hidden;">
        <!-- Left panel: Controls -->
        <div
          style="
            width: 320px;
            padding: 28px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: #161619;
          "
        >
          <div style="display: flex; flex-direction: column; gap: 24px;">
            <div>
              <span
                style="
                  font-size: 0.75rem;
                  font-weight: 700;
                  color: #06b6d4;
                  letter-spacing: 0.1em;
                  text-transform: uppercase;
                "
              >
                📡 Radio de Búsqueda
              </span>
              <div style="font-size: 3rem; font-weight: 800; color: #f3f4f6; marginTop: 10px;">
                {{ tempRadius().toFixed(1) }} <span style="font-size: 1.25rem; color: #9ca3af;">KM</span>
              </div>
            </div>

            <!-- Slider -->
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <input
                type="range"
                [min]="0.5"
                [max]="50"
                [step]="0.5"
                [ngModel]="tempRadius()"
                (ngModelChange)="updateTempRadius($event)"
                style="
                  width: 100%;
                  height: 6px;
                  border-radius: 3px;
                  background-color: rgba(255, 255, 255, 0.1);
                  outline: none;
                  accent-color: #06b6d4;
                "
              />
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  font-size: 0.75rem;
                  color: #6b7280;
                "
              >
                <span>0.5km</span>
                <span>25km</span>
                <span>50km</span>
              </div>
            </div>
          </div>

          <!-- Info Box -->
          <div
            style="
              background-color: rgba(6, 182, 212, 0.06);
              border: 1px solid rgba(6, 182, 212, 0.15);
              border-radius: 16px;
              padding: 16px;
              display: flex;
              gap: 12px;
              align-items: flex-start;
            "
          >
            <i class="material-icons" style="color: #06b6d4; font-size: 20px; margin-top: 2px;">
              info_outline
            </i>
            <p style="margin: 0; font-size: 0.8rem; color: #9ca3af; line-height: 1.5;">
              Haz clic en cualquier punto del mapa para establecer el centro de tu búsqueda. El radio se ajustará automáticamente.
            </p>
          </div>
        </div>

        <!-- Right panel: Map -->
        <div style="flex: 1; position: relative; height: 100%; background-color: #0e0e10;">
          <app-map-component
            [reports]="reports()"
            [center]="tempCenter()"
            [zoom]="13"
            [radiusKm]="tempRadius()"
            [editable]="true"
            (mapClick)="updateTempCenter($event)"
          ></app-map-component>
        </div>
      </div>

      <!-- Footer Actions -->
      <div
        style="
          display: flex;
          justify-content: flex-end;
          align-items: center;
          gap: 16px;
          padding: 20px 28px;
          border-top: 1px solid rgba(255, 255, 255, 0.05);
          background-color: #161619;
        "
      >
        <button
          (click)="handleCancel()"
          style="
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            background-color: transparent;
            color: #9ca3af;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
          "
        >
          Cancelar Selección
        </button>
        <button
          (click)="handleApply()"
          style="
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            background-color: #06b6d4;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(6,182,212,0.3);
            transition: all 0.2s;
          "
        >
          <i class="material-icons" style="font-size: 18px;">check</i>
          Aplicar Filtro Geográfico
        </button>
      </div>
    </div>
  </div>
}
