<div class="carousel-container" [class.zoomable]="zoomable()">
  <div 
    class="carousel-track" 
    [class.draggable]="images().length > 1" 
    (scroll)="onScroll($event)"
    (mousedown)="onMouseDown($event, scrollContainer)"
    (mousemove)="onMouseMove($event, scrollContainer)"
    (mouseup)="onMouseUp(scrollContainer)"
    (mouseleave)="onMouseUp(scrollContainer)"
    #scrollContainer
  >
    @for (image of images(); track image; let i = $index) {
      <div class="carousel-slide">
        <img 
          [src]="image" 
          [alt]="alt() + ' - ' + (i + 1)" 
          loading="lazy"
          draggable="false"
          onerror="this.src='/images/pet-max.png'"
          (click)="onImageClick($event, image)"
        >
      </div>
    }
  </div>

  @if (images().length > 1) {
    <div class="carousel-indicators">
      @for (image of images(); track image; let i = $index) {
        <button 
          class="indicator-dot" 
          [class.active]="i === currentIndex()"
          (click)="scrollTo(i, scrollContainer)"
          [attr.aria-label]="'Ir a la foto ' + (i + 1)"
        ></button>
      }
    </div>
  }
</div>
